<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed"><title>AI 错题本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{--pri:#2f6fed;--pri-d:#1f56c4;--pri-l:#e8f0ff;--ok:#12a150;--ok-l:#e3f7ec;--bad:#e5484d;--bad-l:#fdeced;--warn:#f08c00;--warn-l:#fff4e0;--ink:#1d2433;--sub:#5d6678;--line:#e5e8ef;--bg:#f5f7fb;--card:#fff;--r:14px;--nav:64px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}
.hidden{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:56px}
.brand{font-weight:800;font-size:18px;color:var(--pri);white-space:nowrap;display:flex;align-items:center;gap:6px}
.brand svg{width:26px;height:26px}
.top .sp{flex:1}
.kidsel{min-height:44px;border:1px solid var(--line);border-radius:22px;padding:0 10px;background:var(--pri-l);font-weight:600;max-width:min(46vw,260px);min-width:0}
@media(max-width:420px){.brand span{font-size:16px}}
.iconbtn{min-width:44px;min-height:44px;border:0;background:transparent;border-radius:12px;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--bg)}
.iconbtn svg{width:24px;height:24px}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;z-index:20}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--sub);min-height:44px;padding:0}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--pri);font-weight:700}
main{max-width:1080px;margin:0 auto;padding:14px 12px calc(var(--nav) + 28px)}
@media(min-width:900px){
 .nav{position:sticky;top:56px;bottom:auto;height:52px;justify-content:center;gap:4px;border-top:0;border-bottom:1px solid var(--line);padding:0}
 .nav button{flex:0 0 auto;flex-direction:row;padding:0 18px;font-size:15px;gap:6px}
 .nav button svg{width:20px;height:20px}
 main{padding:20px 20px 40px}
}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--sub);font-size:14px}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.hl{border-color:#bcd0ff;box-shadow:0 2px 10px rgba(47,111,237,.08)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#c9cfdb}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--pri)}
.btn.warnb{background:var(--warn-l);border-color:#ffd8a8;color:#a35a00}
.btn.big{min-height:54px;font-size:17px;padding:0 22px}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd0ff;border-color:var(--pri)}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;flex:0 0 auto}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600;background:var(--bg);color:var(--sub);white-space:nowrap;line-height:24px}
.t-new{background:#eef1f6;color:#4b5567}
.t-rev{background:var(--pri-l);color:var(--pri-d)}
.t-hard{background:var(--bad-l);color:#b4232a}
.t-done{background:var(--ok-l);color:#0b7a3c}
.t-warn{background:var(--warn-l);color:#a35a00}
.t-subj{background:#f1eaff;color:#6b3fd1}
.wrong{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.right{color:var(--ok);font-weight:700}
.pitfall{display:inline-block;background:var(--warn-l);color:#8a4b00;border-radius:8px;padding:2px 8px;font-size:14px}
.mcard .stem{white-space:pre-wrap;margin:6px 0}
.mcard .ans{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:15px}
.mcard .ans b{color:var(--sub);font-weight:600}
.hist{font-size:13px;color:var(--sub);background:var(--bg);border-radius:8px;padding:6px 10px;margin-top:8px}
.hist b{color:var(--ink)}
details summary{cursor:pointer;min-height:36px;display:flex;align-items:center;color:var(--pri);font-weight:600}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:50%;display:inline-block}
.dots .o{background:var(--ok)}.dots .x{background:var(--bad)}
.banner{border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-weight:600}
.banner.bad{background:var(--bad-l);color:#a1161c;border:1px solid #f7c2c4}
.banner.info{background:var(--pri-l);color:var(--pri-d);border:1px solid #cfdcff}
.banner.okb{background:var(--ok-l);color:#0b7a3c;border:1px solid #b6e8cb}
.hero{background:linear-gradient(135deg,#2f6fed,#5b8ef5);color:#fff;border:0}
.hero .muted{color:#e2ebff}
.hero .num{font-size:44px;font-weight:800;line-height:1}
.hero .btn{background:#fff;color:var(--pri);border-color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat .v{font-size:26px;font-weight:800}
.stat .k{font-size:13px;color:var(--sub)}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo .main{flex:1;min-width:0}
.todo .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* week plan */
.weeks{display:grid;grid-template-columns:1fr;gap:12px}
.weeks>*{min-width:0}
@media(min-width:900px){.weeks{grid-template-columns:1fr 1fr}}
.day{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:#fff;min-height:52px}
.day.today{border-color:var(--pri);box-shadow:0 0 0 2px #dbe6ff}
.day.past{background:#fafbfc}
.day.over{outline:2px dashed var(--pri)}
.day h4{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.pi{display:flex;align-items:center;gap:6px;border-radius:10px;padding:6px 8px;background:var(--bg);margin:4px 0;min-height:44px;cursor:grab;font-size:14px}
.pi .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi.done-ok{background:var(--ok-l)}
.pi.done-bad{background:var(--bad-l)}
.pi.late{box-shadow:inset 3px 0 0 var(--bad)}
/* quiz */
.opt{display:block;width:100%;text-align:left;min-height:52px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:16px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-l)}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-l)}
.streak{display:flex;gap:8px;justify-content:center;margin:6px 0}
.streak i{width:22px;height:22px;border-radius:50%;background:#e5e8ef;display:inline-block}
.streak i.on{background:var(--ok)}
.remind{background:var(--warn-l);border:1px solid #ffd8a8;border-radius:12px;padding:10px 12px;margin-top:10px}
/* charts */
.bars .b{display:grid;grid-template-columns:7.5em 1fr 2.5em;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.bars .b .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{background:var(--bg);border-radius:6px;height:16px;overflow:hidden}
.bars .fill{height:100%;background:var(--pri);border-radius:6px}
.stack{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--bg)}
.vbars{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:10px;overflow-x:auto}
.vbars .c{flex:1 0 46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px}
.vbars .c .bar{width:26px;background:var(--pri);border-radius:6px 6px 0 0}
.vbars .c .l{color:var(--sub);text-align:center;line-height:1.2;margin-top:4px;max-width:70px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* thumbs */
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumb{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.uncertain{background:#fff3bf}
/* modal */
.mask{position:fixed;inset:0;background:rgba(18,24,38,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.mask{align-items:center}}
.modal{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
@media(min-width:700px){.modal{border-radius:18px}}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 20px);transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:15px}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.88);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.spin{width:44px;height:44px;border:4px solid #dbe6ff;border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .n{width:30px;height:30px;border-radius:50%;background:var(--pri-l);color:var(--pri);font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.steps .n.done{background:var(--ok);color:#fff}
.steps .tx{flex:1}
.stars{color:#f5a400;letter-spacing:1px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.seg button{flex:0 0 auto;min-height:40px;border-radius:20px;border:1px solid var(--line);background:#fff;padding:0 14px}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
@media(min-width:760px){.filters{grid-template-columns:repeat(5,1fr)}}
.gradeRow{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.gradeRow .main{flex:1;min-width:0}
.gradeRow .btn.on-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.gradeRow .btn.on-bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.gradeRow .btn.on-skip{background:#6b7280;color:#fff}
/* print */
#printArea{display:none}
.pv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;color:#000}
.pv h1{text-align:center;font-size:20px}
.pv .q{margin:0 0 14px;page-break-inside:avoid}
.pv .q .st{white-space:pre-wrap}
.pv .blank{height:70px;border-bottom:1px dashed #bbb}
.pv .ansSec{page-break-before:always;margin-top:24px}
.pv .meta{font-size:12px;color:#555}
@media print{
 body{background:#fff}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}
 #printArea .pv{border:0;padding:0}
}

<script>'use strict';
/* ========== 工具 ========== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ========== 日期（支持 ?today=YYYY-MM-DD 调试快进） ========== */
function pad(n) { return String(n).padStart(2, '0'); }
function fmtD(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseD(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function debugToday() {
  try {
    const q = new URLSearchParams(location.search).get('today');
    if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return q;
    const l = LS.getItem('ctb.debugToday');
    if (l && /^\d{4}-\d{2}-\d{2}$/.test(l)) return l;
  } catch (e) { }
  return null;
}
function today() { return debugToday() || fmtD(new Date()); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); }
function diffDays(a, b) { return Math.round((parseD(a) - parseD(b)) / 86400000); } // a-b
function weekStart(s) { const d = parseD(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return fmtD(d); }
const WD = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
function wdName(s) { return WD[(parseD(s).getDay() + 6) % 7]; }
function md(s) { if (!s) return '—'; const [, m, d] = s.split('-'); return Number(m) + '/' + Number(d); }

/* ========== 存储兜底（预览窗口等受限环境） ========== */
const LS = (() => { try { const k = '__t'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); return window.localStorage; } catch (e) { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; } })();

/* ========== 常量 ========== */
const STAGES = { '小学': ['一年级', '二年级', '三年级', '四年级', '五年级', '六年级'], '初中': ['七年级', '八年级', '九年级'], '高中': ['高一', '高二', '高三'] };
const SUBJ_ALL = { '小学': ['语文', '数学', '英语', '道德与法治', '科学'], '初中': ['语文', '数学', '英语', '物理', '化学', '道德与法治', '地理', '生物'], '高中': ['语文', '数学', '英语', '物理', '化学', '政治', '地理', '生物'] };
const SUBJ_DEF = { '小学': ['语文', '数学', '英语'], '初中': SUBJ_ALL['初中'], '高中': SUBJ_ALL['高中'] };
const CAUSES = ['知识没掌握', '审题出偏差', '习惯有漏洞'];
const INTERVALS = [1, 2, 4, 7, 15, 30];

/* ========== IndexedDB ========== */
const STORES = ['kids', 'exams', 'mistakes', 'pits', 'quizzes', 'actions', 'images', 'kv'];
const DB = {
  db: null,
  mem: null,
  open() {
    return new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open('ai-ctb', 1); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => { const db = r.result; STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); }); };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  useMem() { DB.mem = {}; STORES.forEach(s => DB.mem[s] = new Map()); },
  _req(store, mode, fn) {
    if (DB.mem) {
      const m = DB.mem[store]; let out;
      const st = { getAll: () => ({ result: [...m.values()].map(o => JSON.parse(JSON.stringify(o))) }), get: id => ({ result: m.has(id) ? JSON.parse(JSON.stringify(m.get(id))) : undefined }), put: o => { m.set(o.id, JSON.parse(JSON.stringify(o))); }, delete: id => { m.delete(id); }, clear: () => { m.clear(); } };
      const q = fn(st); if (q) out = q.result; return Promise.resolve(out);
    }
    return new Promise((res, rej) => {
      const t = DB.db.transaction(store, mode); const st = t.objectStore(store); let out;
      const q = fn(st); if (q) q.onsuccess = () => { out = q.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all(s) { return DB._req(s, 'readonly', st => st.getAll()); },
  get(s, id) { return DB._req(s, 'readonly', st => st.get(id)); },
  put(s, o) { return DB._req(s, 'readwrite', st => st.put(o)); },
  putMany(s, arr) { return DB._req(s, 'readwrite', st => { arr.forEach(o => st.put(o)); }); },
  del(s, id) { return DB._req(s, 'readwrite', st => st.delete(id)); },
  delMany(s, ids) { return DB._req(s, 'readwrite', st => { ids.forEach(id => st.delete(id)); }); },
  clear(s) { return DB._req(s, 'readwrite', st => st.clear()); }
};

/* ========== 状态 ========== */
const S = { kids: [], exams: [], mistakes: [], pits: [], quizzes: [], actions: [], kv: {}, kidId: null, route: 'home', params: {}, draft: null, play: null, redo: null, libSel: new Set(), libF: {} };
async function loadAll() {
  for (const s of ['kids', 'exams', 'mistakes', 'pits', 'quizzes', 'actions']) S[s] = await DB.all(s);
  S.kv = {}; (await DB.all('kv')).forEach(r => S.kv[r.id] = r.v);
  S.mistakes.forEach(normM);
  const saved = LS.getItem('ctb.kid');
  S.kidId = S.kids.find(k => k.id === saved) ? saved : (S.kids[0] && S.kids[0].id) || null;
}
async function save(store, o) { const arr = S[store]; const i = arr.findIndex(x => x.id === o.id); if (i >= 0) arr[i] = o; else arr.push(o); await DB.put(store, o); }
async function remove(store, id) { S[store] = S[store].filter(x => x.id !== id); await DB.del(store, id); }
async function kvSet(id, v) { S.kv[id] = v; await DB.put('kv', { id, v }); }
const kid = () => S.kids.find(k => k.id === S.kidId) || null;
const kidById = id => S.kids.find(k => k.id === id);
const pitById = id => S.pits.find(p => p.id === id);
const examById = id => S.exams.find(e => e.id === id);
const mById = id => S.mistakes.find(m => m.id === id);
const kidMs = (kidId = S.kidId) => S.mistakes.filter(m => m.kidId === kidId);

/* ========== 设置 ========== */
const SET_DEF = { apiKey: '', baseUrl: 'https://api.deepseek.com', model: 'deepseek-flash', thinking: 'auto', masterN: 3, requireExplain: true, parentTitle: '妈妈', remindTime: '19:30', notify: false };
function getSet() { try { return Object.assign({}, SET_DEF, JSON.parse(LS.getItem('ctb.settings') || '{}')); } catch (e) { return Object.assign({}, SET_DEF); } }
function setSet(p) { LS.setItem('ctb.settings', JSON.stringify(Object.assign(getSet(), p))); }
const hasKey = () => !!getSet().apiKey.trim();

/* ========== 复习排期核心 ========== */
function normM(m) {

/* ========== 图片压缩 ========== */
function compressImage(file, maxSide = 1600, q = 0.85) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      let { width: w, height: h } = img; const s = Math.min(1, maxSide / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('图片读不出来（格式不支持？）')); };
    img.src = url;
  });

/* ========== 重做（每日做题） ========== */
ACT.startRedo = () => { const q = todayPlan(S.kidId).map(x => x.m.id); if (!q.length) return toast('今天没有待做的题'); S.redo = { queue: q, i: 0, shown: false, t0: Date.now(), res: [] }; go('redo'); };
ACT.redoOne = el => { S.redo = { queue: [el.dataset.id], i: 0, shown: false, t0: Date.now(), res: [] }; go('redo'); };
PAGES.redo = () => {
  const R = S.redo; if (!R) return '<p>没有进行中的做题。</p>';
  if (R.i >= R.queue.length) {
    const ok = R.res.filter(r => r.ok).length;
    return `<section class="card" style="text-align:center"><h1>做完啦！</h1><p style="font-size:18px">共 ${R.res.length} 道，做对 <b class="right">${ok}</b> 道，做错 <b style="color:var(--bad)">${R.res.length - ok}</b> 道。</p>
    <p class="muted">做错的题明天会再出现；做对的题间隔会越来越长。</p>
    ${R.res.filter(r => !r.ok && mById(r.id) && mById(r.id).pitId).slice(0, 2).map(r => { const p = pitById(mById(r.id).pitId); return p ? `<button class="btn warnb" data-act="go" data-r="quiz" data-pit="${p.id}">去闯关：${esc(p.name)}</button>` : ''; }).join(' ')}
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn pri" data-act="go" data-r="home">回首页</button></div></section>`;
  }
  const m = mById(R.queue[R.i]); if (!m) { R.i++; return PAGES.redo(); }
  return `<div class="row between"><span class="muted">第 ${R.i + 1} / ${R.queue.length} 题</span><button class="btn ghost sm" data-act="go" data-r="home">退出</button></div>
  <section class="card mcard"><div class="row"><span class="tag t-subj">${esc(m.subject)}</span>${statusTag(m)}<span class="tag">${esc(m.kp)}</span></div>
    <div class="stem" style="font-size:18px">${esc(m.no ? m.no + '. ' : '')}${esc(m.stem)}</div>
    <p class="muted small">先在纸上做一遍，做完再点“看答案”。</p>
    <div id="ansBox" class="${R.shown ? '' : 'hidden'}">
      <div class="ans"><b>正确答案</b><span class="right">${esc(m.right)}</span><b>当时错答</b><span class="wrong">${esc(m.wrong)}</span></div>
      <p><span class="pitfall">易错点：${esc(m.pitfall)}</span></p><div class="small" style="white-space:pre-wrap">${esc(m.explain)}</div>
      <div class="row" style="margin-top:12px"><button class="btn ok big" data-act="redoMark" data-ok="1">我做对了</button><button class="btn bad big" data-act="redoMark" data-ok="0">我做错了</button></div>
    </div>
    ${R.shown ? '' : '<button class="btn pri big block" data-act="redoShow" style="margin-top:8px">我做完了，看答案</button>'}
  </section>`;
};
ACT.redoShow = () => { S.redo.shown = true; S.redo.sec = Math.round((Date.now() - S.redo.t0) / 1000); render(); };
ACT.redoMark = async el => {
  const R = S.redo, m = mById(R.queue[R.i]); const ok = el.dataset.ok === '1';
  let explain = null;
  if (ok) explain = await explainStep(m);
  else {
    const p = m.pitId && pitById(m.pitId);
    await modal({ title: '没关系，明天再做一次', body: `<div class="remind"><b>记住这个坑：</b>${esc(m.pitfall)}${p ? `<br><b>规则：</b>${esc(p.rule)}` : ''}</div><p class="muted small">这道题已标记为“总错”，会提高复习频率。</p>`, buttons: p ? [{ text: '下一题', value: 0 }, { text: '去闯关：' + esc(p.name), cls: 'warnb', value: 1 }] : [{ text: '下一题', cls: 'pri', value: 0 }] })
      .then(v => { if (v === 1) R.goPit = p.id; });
  }
  recordAttempt(m, ok, { sec: R.sec, explain });
  await save('mistakes', m);
  R.res.push({ id: m.id, ok }); R.i++; R.shown = false; R.t0 = Date.now();
  if (m.mastered) toast('这道题已掌握，不再排入计划');
  if (R.goPit) { const p = R.goPit; R.goPit = null; return go('quiz', { pit: p }); }
  render();
};
async function explainStep(m) {
  const pn = parentName();
  return modal({
    title: `讲给${esc(pn)}听`,
    body: `<p>做对啦！现在用 <b>1 分钟</b> 讲给${esc(pn)}听：</p><ol><li><b>坑在哪？</b>这道题最容易错在哪一步。</li><li><b>下次看到什么信号要警惕？</b>题目里哪个字、哪个条件提醒你“小心这个坑”。</li></ol>
      <div class="remind small">参考：${esc(m.pitfall)}</div><p class="muted small">${esc(pn)}听完点下面的按钮。</p>`,
    buttons: [{ text: '先跳过', value: null }, { text: '没讲清', value: false }, { text: '讲通了', cls: 'ok', value: true }]
  });
}

/* ========== 周计划 ========== */
PAGES.plan = () => {
  const k = kid(), T = today(), ws = weekStart(T), nws = addDays(ws, 7), end = addDays(nws, 6);
  const plan = buildPlan(k.id, end);
  const col = (start, title) => {
    let h = `<div><h2>${title} <span class="muted small">${md(start)}–${md(addDays(start, 6))}</span></h2>`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, i);
      if (d < T) {
        const at = attemptsOn(k.id, d);
        h += `<div class="day past" data-day="${d}"><h4><span>${WD[i]} ${md(d)}</span><span class="muted small">已做 ${at.length}</span></h4>${at.map(x => `<div class="pi ${x.a.ok ? 'done-ok' : 'done-bad'}"><span class="tag ${x.a.ok ? 't-done' : 't-hard'}">${x.a.ok ? '对' : '错'}</span><span class="tx">${esc(x.m.subject)} · ${esc(x.m.stem.split('\n')[0])}</span></div>`).join('') || '<span class="muted small">没有记录</span>'}</div>`;
      } else {
        const list = plan.days[d] || []; const at = d === T ? attemptsOn(k.id, d) : [];
        h += `<div class="day ${d === T ? 'today' : ''}" data-day="${d}"><h4><span>${WD[i]} ${md(d)}${d === T ? ' · 今天' : ''}</span><span class="muted small">${list.length} 道</span></h4>
        ${at.map(x => `<div class="pi ${x.a.ok ? 'done-ok' : 'done-bad'}"><span class="tag ${x.a.ok ? 't-done' : 't-hard'}">${x.a.ok ? '对' : '错'}</span><span class="tx">${esc(x.m.subject)} · ${esc(x.m.stem.split('\n')[0])}</span></div>`).join('')}
        ${list.map(x => `<div class="pi ${x.overdue ? 'late' : ''}" draggable="true" data-mid="${x.m.id}" data-act="planItem" data-id="${x.m.id}"><span class="tag t-subj">${esc(x.m.subject)}</span>${x.m.hard ? '<span class="tag t-hard">总错</span>' : ''}${x.overdue ? '<span class="tag t-hard">逾期</span>' : x.carried ? '<span class="tag t-warn">顺延</span>' : ''}<span class="tx">${esc(x.m.stem.split('\n')[0])}</span></div>`).join('')}</div>`;
      }
    }
    return h + '</div>';
  };
  const ws1 = weekStats(k.id);
  return `<div class="row between"><h1>${esc(k.name)}的复习计划</h1><span class="muted small">每天上限 ${k.cap || 5} 道 <button class="btn ghost sm" data-act="editKid" data-id="${k.id}">修改</button></span></div>
  ${plan.overdue ? `<div class="banner bad" id="overdueBanner">逾期 ${plan.overdue} 道：已自动顺延，优先排在今天和之后几天。</div>` : '<div class="banner okb">没有逾期的题，保持节奏！</div>'}
  <div class="row" style="margin-bottom:12px"><button class="btn pri" data-act="go" data-r="print" data-mode="week">生成本周练习卷</button><button class="btn" data-act="go" data-r="print" data-mode="today">今日练习卷</button><button class="btn" data-act="go" data-r="grade">批改登记</button><button class="btn" data-act="exportIcs">导出日历提醒</button></div>
  <p class="muted small">本周完成率 ${ws1.rate === null ? '—' : ws1.rate + '%'} · 按时完成率 ${ws1.onTimeRate === null ? '—' : ws1.onTimeRate + '%'} · 本周新掌握 ${ws1.newMastered} 道。点题目可改期/跳过；电脑上可直接拖到别的日子。同一天会尽量安排不同科目、不同坑、不同考试的题（交错练习）。</p>
  <div class="weeks" id="weeks">${col(ws, '本周要做')}${col(nws, '下周要做')}</div>`;
};
AFTER.plan = () => {
  $$('.pi[draggable]').forEach(p => p.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', p.dataset.mid); }));
  $$('.day:not(.past)').forEach(d => {
    d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('over'); });
    d.addEventListener('dragleave', () => d.classList.remove('over'));
    d.addEventListener('drop', async e => { e.preventDefault(); d.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (id) await moveTo(id, d.dataset.day); });
  });
};
async function moveTo(id, day) { const m = mById(id); m.due = day; m.pinned = true; await save('mistakes', m); toast(`已改到 ${md(day)} ${wdName(day)}`); render(); }
ACT.planItem = async el => {
  const m = mById(el.dataset.id);
  const v = await modal({
    title: '安排这道题', body: `<p>${esc(m.stem.split('\n')[0])}</p>${histLine(m)}<label class="f">改到哪天</label><input type="date" id="mvDate" value="${m.due < today() ? today() : m.due}" min="${today()}">`,
    buttons: [{ text: '关闭', value: null }, { text: '跳过（推到明天）', value: 'skip' }, { text: '移出计划（归档）', value: 'arch' }, { text: '现在做', value: 'do' }, { text: '改期', cls: 'pri', value: mm => 'mv:' + $('#mvDate', mm).value }]
  });
  if (!v) return;
  if (v === 'do') return ACT.redoOne(el);
  if (v === 'skip') { const base = m.due < today() ? today() : m.due; m.due = addDays(base, 1); m.pinned = true; m.skips = (m.skips || 0) + 1; await save('mistakes', m); toast('已推到 ' + md(m.due)); return render(); }
  if (v === 'arch') { m.archived = true; m.due = null; await save('mistakes', m); toast('已归档，不再排入计划'); return render(); }
  if (v.startsWith('mv:') && v.length > 3) return moveTo(m.id, v.slice(3));
};
ACT.exportIcs = () => {
  if (!S.kids.length) return toast('先建孩子档案');
  const t = getSet().remindTime || '19:30';
  download('AI错题本提醒.ics', makeICS(S.kids, t), 'text/calendar;charset=utf-8');
  alertBox('日历提醒已导出', `已为 ${S.kids.map(k => esc(k.name)).join('、')} 生成每天 ${t} 的复习提醒，以及每周日 20:00“看下周计划”。<br><br>在手机上打开这个 .ics 文件即可加入日历。<br><span class="muted small">说明：网页关掉后无法自己推送通知，所以用日历提醒兜底。</span>`);
};

/* ========== 批改登记 ========== */
PAGES.grade = () => {
  const k = kid(); const sh = S.kv['sheet:' + k.id];
  const src = S.params.src || (sh ? 'sheet' : 'today');
  let ids = src === 'sheet' && sh ? sh.items.map(x => x.id) : todayPlan(k.id).map(x => x.m.id);
  ids = ids.filter(id => mById(id) && !mById(id).archived);
  S.gradeIds = ids; S.gradeMarks = S.gradeMarks || {};
  return `<h1>批改登记</h1><p class="muted">孩子做完纸质练习卷后，按题点“对 / 错”，一次回填做题记录。</p>
  <div class="seg">${sh ? `<button data-act="go" data-r="grade" data-src="sheet" class="${src === 'sheet' ? 'on' : ''}">最近的练习卷（${md(sh.date)}，${sh.items.length} 题）</button>` : ''}<button data-act="go" data-r="grade" data-src="today" class="${src === 'today' ? 'on' : ''}">今日计划</button></div>
  <div class="card"><label class="f">做题日期</label><input type="date" id="gDate" value="${today()}" max="${today()}">
  ${ids.length ? ids.map((id, i) => { const m = mById(id), mk = S.gradeMarks[id]; return `<div class="gradeRow" data-gid="${id}"><div class="main"><b>${i + 1}.</b> <span class="tag t-subj">${esc(m.subject)}</span> ${esc(m.stem.split('\n')[0])}<div class="small">答案：<span class="right">${esc(m.right)}</span>${m.mastered ? ' <span class="tag t-done">已掌握</span>' : ''}</div></div>
    <button class="btn sm ${mk === 'ok' ? 'on-ok' : ''}" data-act="gMark" data-id="${id}" data-v="ok">对</button><button class="btn sm ${mk === 'bad' ? 'on-bad' : ''}" data-act="gMark" data-id="${id}" data-v="bad">错</button><button class="btn sm ${mk === 'skip' ? 'on-skip' : ''}" data-act="gMark" data-id="${id}" data-v="skip">没做</button></div>`; }).join('') : '<p class="muted">没有要登记的题。</p>'}
  ${ids.length ? `<label class="chk" style="margin-top:8px"><input type="checkbox" id="gExplain">做对的题都已讲给${esc(parentName())}听，讲通了</label><button class="btn pri big block" data-act="gSubmit" style="margin-top:8px">提交登记</button>` : ''}</div>`;
};
ACT.gMark = el => { S.gradeMarks[el.dataset.id] = el.dataset.v; const row = el.closest('.gradeRow'); $$('.btn', row).forEach(b => b.classList.remove('on-ok', 'on-bad', 'on-skip')); el.classList.add('on-' + el.dataset.v); };
ACT.gSubmit = async () => {
  const date = $('#gDate').value || today(); const ex = $('#gExplain').checked; let n = 0, mast = 0;
  for (const id of S.gradeIds) {
    const v = S.gradeMarks[id]; if (!v || v === 'skip') continue;
    const m = mById(id); if (m.mastered) continue;
    recordAttempt(m, v === 'ok', { date, src: 'sheet', explain: v === 'ok' && ex ? true : null }); await save('mistakes', m); n++; if (m.mastered) mast++;
  }
  S.gradeMarks = {};
  if (!n) return toast('还没有点任何一题');
  await alertBox('登记完成', `已回填 ${n} 道题的做题记录${mast ? `，其中 ${mast} 道达到“已掌握”` : ''}。做错的题会在第二天再出现。`);
  go('home');
};

async function applyPits(sub, groups) {
  const kidId = S.kidId; const old = S.pits.filter(p => p.kidId === kidId && p.subject === sub);
  const keep = [];

    if (!g.ids.length) continue;
    const prev = old.find(p => p.name === g.name);
    const p = prev ? Object.assign(prev, { rule: g.rule, stars: g.stars, mistakeIds: g.ids }) : { id: uid(), kidId, subject: sub, name: g.name, rule: g.rule, stars: g.stars, mistakeIds: g.ids, passed: false, bestStreak: 0, createdAt: Date.now() };
    keep.push(p); await save('pits', p);
  }
  for (const p of old) if (!keep.includes(p)) { await remove('pits', p.id); for (const q of S.quizzes.filter(q => q.pitId === p.id)) await remove('quizzes', q.id); }
  for (const p of keep) for (const id of p.mistakeIds) { const m = mById(id); if (m) { m.pitId = p.id; await save('mistakes', m); } }
  toast(`归纳出 ${keep.length} 个坑`); render();
}

};

  const titles = { today: '今日练习卷', week: '本周练习卷', sel: '错题卷（选中）', pit: '坑专项卷', subject: '科目错题卷', cheat: '考前速览' };
  const nav = `<div class="seg">${['today', 'week', 'sel', 'subject', 'cheat'].map(x => `<button data-act="go" data-r="print" data-mode="${x}" data-subject="${esc(S.params.subject || k.subjects[0])}" class="${mode === x ? 'on' : ''}">${titles[x]}</button>`).join('')}</div>`;
  if (mode === 'cheat') return `<h1>考前速览</h1>${nav}<div class="row" style="margin-bottom:10px"><button class="btn pri" data-act="doPrint">打印</button></div><div class="pv" id="pv"><h1>${esc(k.name)} · 考前速览</h1><p class="meta">所有坑的一句话教训 · ${today()}</p>${cheatHTML(k.id, true)}</div>`;
  const items = printItems(mode);
  let body = '', ans = '';
  items.forEach((x, i) => {
    const m = x.m;
    body += `<div class="q"><div class="meta">${i + 1}. ${esc(m.subject)}${x.day ? ' · ' + md(x.day) + wdName(x.day) : ''} · ${esc(m.kp)}</div><div class="st">${esc(m.stem)}</div>${o.wrong ? `<div class="meta">当时错答：${esc(m.wrong)}</div>` : ''}${o.blank ? '<div class="blank"></div>' : ''}</div>`;
    ans += `<div class="q"><b>${i + 1}.</b> 答案：${esc(m.right)}<br><span class="meta">易错点：${esc(m.pitfall)}</span><div class="st small">${esc(m.explain)}</div></div>`;
  });
  return `<h1>${titles[mode]}</h1>${nav}
  ${mode === 'subject' ? `<select id="prSub" style="max-width:240px;margin-bottom:8px">${k.subjects.map(s => `<option ${s === S.params.subject ? 'selected' : ''}>${s}</option>`).join('')}</select>` : ''}

  <div class="row"><button class="btn pri big" data-act="doPrint" ${items.length ? '' : 'disabled'}>打印（${items.length} 题）</button>${['today', 'week'].includes(mode) && items.length ? '<span class="muted small">做完后到“批改登记”逐题点对/错。</span>' : ''}</div></div>
  <div class="pv" id="pv"><h1>${esc(k.name)} · ${titles[mode]}</h1><p class="meta">${k.stage}${k.grade} · 打印日期 ${today()} · 共 ${items.length} 题　姓名：________　用时：______</p>
  ${body || '<p>没有题目。</p>'}${o.ans && items.length ? `<div class="ansSec"><h2>答案与解析</h2>${ans}</div>` : ''}</div>`;

async function importData(inp) {
  const f = inp.files[0]; if (!f) return; inp.value = '';
  let d; try { d = JSON.parse(await f.text()); } catch (e) { return alertBox('导入失败', '这个文件不是有效的 JSON。'); }
  if (!d || d.app !== 'ai-ctb') return alertBox('导入失败', '这不是 AI 错题本的备份文件。');
  if (!await confirmBox('导入备份', `将导入 ${(d.kids || []).length} 个孩子、${(d.mistakes || []).length} 道错题。同一条记录会被备份里的覆盖，其他数据保留。`, '导入')) return;
  for (const s of ['kids', 'exams', 'mistakes', 'pits', 'quizzes', 'actions', 'images', 'kv']) if (Array.isArray(d[s]) && d[s].length) await DB.putMany(s, d[s]);

/* ========== 提醒 ========== */
function todaySummary() {
  const a = allKidsToday(); return { a, total: a.reduce((s, x) => s + x.n, 0), over: a.reduce((s, x) => s + x.over, 0) };
}
function summaryText(s) { return `今天要做 ${s.total} 道（${s.a.map(x => `${x.k.name} ${x.n} 道`).join('、')}）${s.over ? `，逾期 ${s.over} 道` : ''}`; }
let notifyT = null;
function startNotify() {
  if (notifyT || !getSet().notify || !('Notification' in window) || Notification.permission !== 'granted') return;
  const tick = () => {
    const st = getSet(); const now = new Date(); const hm = pad(now.getHours()) + ':' + pad(now.getMinutes());
    if (hm >= st.remindTime && LS.getItem('ctb.notified') !== today()) {
      const s = todaySummary(); if (s.total) { try { new Notification('AI 错题本', { body: summaryText(s) }); } catch (e) { } }
      LS.setItem('ctb.notified', today());
    }
  };
  tick(); notifyT = setInterval(tick, 30000);
}
async function openPopup() {
  if (!S.kids.length || sessionStorage.getItem('ctb.popup') === today()) return;
  sessionStorage.setItem('ctb.popup', today());
  const s = todaySummary(); if (!s.total && !s.over) return;
  const v = await modal({ title: '今日复习提醒', body: `<p style="font-size:18px" id="popupText">${esc(summaryText(s))}</p><p class="muted small">做完一题点一题，或者打印练习卷做完再登记。</p>`, buttons: [{ text: '稍后', value: null }, { text: '开始做题', cls: 'pri', value: 'go' }] });
  if (v === 'go') { const first = s.a.find(x => x.n); if (first && first.k.id !== S.kidId) { S.kidId = first.k.id; LS.setItem('ctb.kid', S.kidId); } ACT.startRedo(); }
}

/* ========== 启动 ========== */
async function init() {
  try { await Promise.race([DB.open(), new Promise((_, rj) => setTimeout(() => rj(new Error('timeout')), 3000))]); } catch (e) {
    DB.useMem();
    const bar = document.createElement('div');
    bar.style.cssText = 'position:sticky;top:0;z-index:999;background:#fff4e5;color:#8a4b00;padding:10px 14px;font-size:14px;line-height:1.5;border-bottom:1px solid #f3c98b';
    bar.textContent = '现在是预览模式：可以试用，但关掉后数据不会保存。请把文件下载到电脑或手机，用 Chrome、Edge 或 Safari 打开，数据才会长期保存。';
    document.body.prepend(bar);
  }
  await loadAll(); await snapshotPlans();
  const h = location.hash.slice(1); if (PAGES[h] && !['redo', 'review', 'quiz'].includes(h)) S.route = h;
  render(); startNotify(); openPopup();
  window.CTB = { S, today, addDays, buildPlan, recordAttempt, statusOf, makeICS, weekStats, todayPlan, getSet, setSet, render, go, loadAll };
}
document.addEventListener('DOMContentLoaded', init);
